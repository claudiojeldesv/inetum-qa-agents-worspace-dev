# Style Contract — Vaadin Bakery (Vaadin Flow, Java corporativo)
# Schema docs: docs/references/style-contract-schema.md
#
# Sitio 5 de la GIRA DE STACKS del kernel v2. Familia de stack: Vaadin Flow — la
# UI se declara en Java y se renderiza en SERVIDOR sobre web components. Es la
# opción de los equipos de banca/seguros que son de Java puro y no quisieron un
# front separado. Aplicación oficial de demostración (login, pedidos,
# mantenimientos), no una galería de componentes. Autorizado QA 2026-08-16.
#
# PRIMERA FAMILIA DE LA GIRA CON SHADOW DOM DE VERDAD, y ese es el motivo de
# elegirla. Patologías esperadas (declaradas, no medidas todavía): la etiqueta
# vive dentro del shadow root del componente y el <input> va reproyectado por
# slot, así que la asociación etiqueta↔control cruza la frontera; rejillas
# virtualizadas que solo materializan lo visible; ids generados por el framework.

version: 1
project: vaadin-bakery

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole        # los ids los genera Vaadin; el nombre accesible es lo único estable
    - getByLabel
    # K0.39 — declarado DESPUÉS del run ciego, y por eso se dice: en este stack el
    # buscador no tiene etiqueta ni nombre accesible (la referencia ARIA muere en la
    # frontera del shadow, ver §28), así que lo único escrito es el marcador. Es la
    # clase de conocimiento que vive en el pack de la FAMILIA, no en el kernel.
    - getByPlaceholder
    - getByText
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/vaadin-bakery.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false
  severity_threshold:
    - serious
    - critical

evidence:
  level: full
  screenshots: on

# SIN bloque `settle` a propósito, igual que UI5 (§23), JSF (§24) y PrimeNG (§26).
# Vaadin hace ida y vuelta al servidor en cada interacción y tiene señales propias
# de ocupado; declararlas ANTES de medir haría imposible saber si el walker se
# sincroniza solo o si lo hizo la pista que le di.

synthetic_fixtures:
  credentials:
    - username: admin@vaadin.com
      password: admin
  test_cards: []
  test_iban: []

test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
