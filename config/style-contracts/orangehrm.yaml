# Style Contract — opensource-demo.orangehrmlive.com — HR portal demo (auth + SPA)
# Schema docs: docs/references/style-contract-schema.md
# OrangeHRM OS 5.8: SPA moderna (no JSP legacy). Login y dashboard exponen
# buenos roles/nombres accesibles — locators semánticos resuelven sin fallback CSS
# (DOM verificado en vivo: textbox "Username"/"Password", button "Login",
# heading "Dashboard"). De ahí que, a diferencia de parabank.yaml, NO se declare
# css_fallback_attributes.
#
# Objetivo del sitio: login-gated con sesión persistente (mismo patrón auth-handler
# que ParaBank). El balance/estado del demo es compartido y se resetea
# periódicamente → no assertar datos exactos, solo señales de UI.
#
# A11y (decisión SDET): inject del check axe siempre (hard rule SPEC). Demo público
# con probables violaciones; fail_on_violations=false → WARNING auditable, no
# bloqueante en esta fase.

version: 1
project: orangehrm

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole
    - getByPlaceholder
    - getByLabel
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/orangehrm.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false        # WARNING importante, no bloqueante (decisión SDET)
  severity_threshold:
    - serious
    - critical

# auth-handler (Fase C): login una vez → storageState; el config lo activa vía
# QA_STORAGE_STATE. success_signal verificado en vivo: tras login la URL cae en
# /web/index.php/dashboard/index y el topbar muestra el heading "Dashboard".
auth:
  enabled: true
  login_path: /web/index.php/auth/login
  storage_state: playwright/.auth/admin.json
  credentials_ref: 0
  success_signal:
    type: locator
    value: "getByRole('heading', { name: 'Dashboard' })"

# Evidencia visual para el reporte Allure: captura el estado final de cada test.
evidence:
  screenshots: on

# Credenciales demo públicas de OrangeHRM (documentadas en la propia pantalla de
# login). Cuenta compartida y reseteable → no assertar datos persistentes.
synthetic_fixtures:
  credentials:
    - username: Admin
      password: admin123
  test_cards: []
  test_iban: []

# Política de diseño de test ("validar con cabeza") — enforced por ia4d-reviewer (MF-9).
test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  coverage:
    default:
      - happy
  no_assume_undiscovered_flows: true

# Sin bloque `taxonomy`: el flujo crítico de este lab es el login, que ya cubre la
# semilla transversal del agente (auth). El dashboard/widgets son soporte, no crítico.
# Caso didáctico del contrario a saucedemo/parabank: no todo sitio necesita taxonomy.

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
