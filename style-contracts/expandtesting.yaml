# Style Contract — practice.expandtesting.com (v0.2 Fase B, sitio 1)
# Schema docs: docs/references/style-contract-schema.md
# Nota Fase B: a diferencia de SauceDemo, expandtesting NO expone data-test en
# todo. La prioridad de locators mantiene getByTestId primero pero el fallback
# real será getByLabel/getByRole (id/name + labels). Es dato a catalogar.

version: 1
project: expandtesting

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByTestId
    - getByRole
    - getByLabel
    - getByText
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  spec_pattern: '{feature}.{scenario}.spec.ts'
  test_title_pattern: '{scenario_human_name}'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: true
  severity_threshold:
    - serious
    - critical

# Credenciales publicadas en la propia /login de expandtesting — no son PII real
synthetic_fixtures:
  credentials:
    - username: practice
      password: 'SuperSecretPassword!'
  test_cards: []
  test_iban: []

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
