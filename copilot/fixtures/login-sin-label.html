<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Login sin label asociado</title></head>
<!--
  La CLASE, genérica: formulario de tabla donde la etiqueta visible vive en una
  celda hermana y NO está asociada al input (sin `for=`, sin aria-label, sin
  placeholder). Es el patrón label-en-celda de JSF/JSP/legacy — medio mundo
  corporativo. Para el navegador y para un lector de pantalla, estos campos NO
  tienen nombre accesible: getByLabel/getByRole({name}) devuelven 0. La única seña
  que coincide con el vocabulario del plan ("Usuario") es el texto visible vecino.

  No imita onesait: reproduce la clase. Los ids username/password son comunes; el
  botón lleva su rótulo en `value`, como cualquier <input type=submit>.
-->
<body>
  <h1>Acceso</h1>
  <table>
    <tr><td>Usuario</td><td><input id="username" type="text"></td></tr>
    <tr><td>Contraseña</td><td><input id="password" type="password"></td></tr>
  </table>
  <input type="submit" value="Acceder" id="entrar">
  <div id="salida"></div>
  <script>
    document.getElementById('entrar').addEventListener('click', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u && p) document.getElementById('salida').innerHTML = '<div role="status">Sesión iniciada</div>';
    });
  </script>
</body>
</html>
