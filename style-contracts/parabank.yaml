# Style Contract — parabank.parasoft.com — v0.2 Fase B, sitio 3
# Schema docs: references/style-contract-schema.md
# Nota Fase B: ParaBank es banca demo JSP clásica (sin data-test). Inputs por
# name (username/password), comboboxes para account #, botones por texto.
# La prioridad de locators invierte el orden de los sitios anteriores:
# getByLabel/getByRole primero (no hay getByTestId que valga).
#
# Objetivo del sitio: cazar la categoría auth-handler (login persistente,
# storageState). El schema del style-contract NO contempla auth todavía
# (hallazgo Fase C catalogado en wild-sites-report.md): la persistencia de
# sesión la estructura el planner/writer desde el brief, no este contract.
#
# A11y (decisión SDET): ParaBank es JSP viejo, alta probabilidad de violaciones
# serias en login. Se inyecta el check axe (hard rule del SPEC se respeta) pero
# fail_on_violations=false: a11y es WARNING importante en esta fase, no
# bloqueante. Captura el dato sin abortar el flujo bajo prueba.

version: 1
project: parabank

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByLabel
    - getByRole
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  spec_pattern: '{feature}.{scenario}.spec.ts'
  test_title_pattern: '{scenario_human_name}'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false        # WARNING importante, no bloqueante (decisión SDET Fase B)
  severity_threshold:
    - serious
    - critical

# Credenciales demo públicas de Parasoft (cuenta compartida, no PII real).
# Estado compartido: el balance de john cambia con cada ejecución de cualquiera
# → el test NO debe assertar balance exacto, solo "Transfer Complete!" + monto.
synthetic_fixtures:
  credentials:
    - username: john
      password: demo
  test_cards: []
  test_iban: []

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
