<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Catálogo — clases de la familia UI5</title>
<!--
  Reproduce la DISPOSICIÓN de las tres clases medidas en el sitio 2 de la gira
  (SAP UI5, app de demostración Shopping Cart). Cero cadenas del sitio en el
  kernel: lo que se prueba es la clase.

  A. NOMBRE DUPLICADO POR SUBSTRING — el control lleva `aria-label="Search"` y la
     región que lo envuelve lleva "Product Catalog Search and Navigation", que lo
     CONTIENE. `getByLabel('Search')` ve dos; exacto ve uno.
  B. EL HINT DE NOMBRE QUE CAE A TEXTO — dos botones cuyo nombre accesible
     contiene "Cart": uno solo-icono ("Show Shopping Cart") y otro con texto
     ("Add to Cart"). Un hint {name:'Cart'} sin `role` no produce intento de rol,
     así que la escalera cae al peldaño de texto: substring encuentra UNA sola
     coincidencia visible —el botón de añadir— y el walker lo pulsaría.
  C. EL AVISO QUE RESTATE EL HECHO — al añadir sale un cartel role=alert cuyo
     texto contiene a la vez "shopping cart" y el nombre del producto.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
           background: #333; color: #fff; padding: 10px 14px; border-radius: 4px; }
  [hidden] { display: none !important; }
  section { padding: 12px; }
</style>

<header>
  <strong>Product Catalog</strong>
  <!-- clase A: la región y el input comparten la palabra del hint -->
  <div role="region" aria-label="Product Catalog Search and Navigation">
    <input id="buscador" type="search" aria-label="Search" placeholder="Search">
  </div>
  <span style="flex:1"></span>
  <!-- clase B: solo-icono, sin texto visible -->
  <button id="ver-carrito" aria-label="Show Shopping Cart" title="Show Shopping Cart">&#128722;</button>
</header>

<section id="detalle">
  <h1>Astro Laptop 1516</h1>
  <p>Supplier: Ultrasonic United</p>
  <p>Weight: 4.2 KG</p>
  <button id="anadir">Add to Cart</button>
  <p>Unidades a&ntilde;adidas: <span id="contador">0</span></p>
</section>

<!-- clase C: el aviso efímero nombra el hecho con las mismas palabras -->
<div id="toast" role="alert" hidden></div>

<section id="carrito" aria-label="Shopping Cart" hidden>
  <h2>Shopping Cart</h2>
  <p id="linea">Astro Laptop 1516</p>
  <p>Total: 989,00 EUR</p>
</section>

<script>
  const $ = (id) => document.getElementById(id);
  let unidades = 0;
  $('anadir').addEventListener('click', () => {
    unidades += 1;
    $('contador').textContent = String(unidades);
    const t = $('toast');
    t.textContent = 'Product "Astro Laptop 1516" added to your shopping cart';
    t.hidden = false;
    setTimeout(() => { t.hidden = true; }, 3000);
  });
  $('ver-carrito').addEventListener('click', () => { $('carrito').hidden = false; });
  $('buscador').addEventListener('input', (e) => {
    $('detalle').hidden = e.target.value.length > 0 && e.target.value !== 'Astro';
  });
</script>
</html>
