# Allowed targets — compliance pre-flight
# Reglas en docs/references/compliance-rules.md
# El hook hooks/pre-flight.ts valida URL contra estos patrones.
#
# Esta es la allowlist del workspace. Para apuntar el agente a TU web:
# añade aquí su patrón URL (entorno NO productivo) y, si usa credenciales de test
# documentadas, decláralas en allowed_test_credentials. Compliance pre-flight bloquea
# cualquier URL que no matche — no hay flag de override (regla dura del agente).

version: 1
mode: greybox                      # greybox | whitebox

patterns:
  # Demos públicos usados por los ejemplos del template
  - 'https://www.saucedemo.com/*'            # ejemplo S4 (e-commerce)
  - 'https://parabank.parasoft.com/*'        # ejemplo S2/S3/S4 (banca demo, auth + estado)
  - 'https://opensource-demo.orangehrmlive.com/*'  # ejemplo S4 (HR portal SPA, auth persistente)
  - 'https://demo.playwright.dev/*'
  - 'https://todomvc.com/*'                  # lab-desafío (brief abierto)

  # Gira de dominio (2026-08-23) — aplicaciones de NEGOCIO reales sobre las que se
  # mide el producto. Demos públicos, sin datos personales.
  - 'https://demo.mifos.io/*'                # Mifos X web-app (core banking Angular sobre Fineract)
  - 'https://demo.dolibarr.org/*'            # Dolibarr ERP/CRM 23.x (PHP legacy), demo publico
  - 'https://the-internet.herokuapp.com/*'    # sitio de practica QA (Sinatra), demo publico; autorizado QA 2026-08-24
  - 'https://automationintesting.online/*'    # Restful Booker Platform (hotel B&B), sandbox de testing; autorizado QA 2026-08-30

  # Entornos no productivos (cualquier subdominio) — añade los tuyos
  - 'https://*.qa.*'
  - 'https://*.test.*'
  - 'https://*.int.*'
  - 'https://*.staging.*'
  - 'https://*.dev.*'
  - 'https://*.uat.*'

  # Local
  - 'http://localhost:*'
  - 'http://127.0.0.1:*'
  - 'http://0.0.0.0:*'

# Patrones explícitamente prohibidos (regla C2 — production-like)
forbidden_patterns:
  - 'https://www.*.com/login'      # heurística: prod
  - 'https://prod.*'
  - 'https://*.production.*'

