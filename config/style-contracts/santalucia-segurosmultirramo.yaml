# Style Contract — www.santalucia.es/es/segurosmultirramo — Seguros Multirramo
# Schema docs: docs/references/style-contract-schema.md
#
# Landing comercial de Santalucía Seguros, sección multirramo. Sin login (público).
# El happy-path se descubre en el Acto 2 (planner contra DOM real); contract declara
# convenciones, NO form_data específico.
#
# Convenciones del cliente regulado (seguros ES): locators semánticos prioritarios,
# fallback CSS acotado a [name, id] como red de seguridad para componentes custom
# corporativos, a11y en modo warning (sitio prod comercial, no foco).

version: 1
project: santalucia-segurosmultirramo

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByLabel
    - getByRole
    - getByPlaceholder
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true
  css_fallback_attributes:
    - name
    - id

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/santalucia-segurosmultirramo.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false        # gate off (modo warning auditable)
  severity_threshold:
    - serious
    - critical

# Sección pública sin sesión persistente.
auth:
  enabled: false

# Evidencia visual para Allure (estado final de cada test).
evidence:
  screenshots: on

# Sin form_data ni credenciales. Si discovery encuentra simuladores/calculadoras
# con inputs, se rellenan con sintéticos declarados aquí post-mapping.
synthetic_fixtures:
  credentials: []
  test_cards: []
  test_iban: []

# En S4 la criticidad se infiere por el propósito del sitio (seguros multirramo): tarificar/
# contratar y la gestión de pólizas/siniestros son los flujos centrales. Ya no por keywords.

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
