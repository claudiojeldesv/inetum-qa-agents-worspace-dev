# Style Contract — SauceDemo MVP demo
# Schema docs: references/style-contract-schema.md

version: 1
project: saucedemo

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByTestId      # SauceDemo expone data-test en todo elemento interactivo
    - getByRole
    - getByLabel
    - getByText
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  spec_pattern: '{feature}.{scenario}.spec.ts'
  test_title_pattern: '{scenario_human_name}'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false   # gate off por defecto (v0.2 design/gates-off-by-default); warning, no aborta
  severity_threshold:
    - serious
    - critical

# Evidencia visual para el reporte Allure. level: full → el ia4d-writer instrumenta cada
# acción con test.step() + screenshot por paso, y el command exporta QA_SCREENSHOT=on +
# QA_TRACE=on (captura final + trace navegable). Es el ejemplo de referencia "PRO".
evidence:
  level: full
  screenshots: on

# Credenciales publicadas por Sauce Labs — no son PII real
synthetic_fixtures:
  credentials:
    - username: standard_user
      password: secret_sauce
    - username: locked_out_user
      password: secret_sauce
    - username: problem_user
      password: secret_sauce
    - username: performance_glitch_user
      password: secret_sauce
  # Credenciales deliberadamente inválidas para escenarios negativos (plan §1.2) — no son PII
  invalid_credentials:
    - username: invalid_user
      password: wrong_password
  test_cards: []
  test_iban: []
  shipping_info:
    - first_name: Test
      last_name: User
      postal_code: "12345"

# Política de diseño de test ("validar con cabeza") — enforced por ia4d-reviewer (MF-9).
test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  coverage:
    happy_path: always
    negative: regression_only
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
