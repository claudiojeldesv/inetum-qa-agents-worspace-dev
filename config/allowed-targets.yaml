# Allowed targets — compliance pre-flight
# Reglas en docs/references/compliance-rules.md
# El hook hooks/pre-flight.ts valida URL contra estos patrones.

version: 1
mode: greybox                      # greybox | whitebox

# Lista de patrones URL permitidos. Cualquier URL que NO matche un pattern
# de esta lista será bloqueada por el pre-flight (regla C1).
patterns:
  # Demo apps usadas por el MVP
  - 'https://www.saucedemo.com/*'
  - 'https://demo.playwright.dev/*'
  - 'https://todomvc.com/*'

  # Sitios reales de práctica — v0.2 Fase B (sandboxes públicos de automation testing)
  - 'https://practice.expandtesting.com/*'
  - 'https://practicesoftwaretesting.com/*'
  - 'https://parabank.parasoft.com/*'    # sitio 3: banca demo (auth + estado)
  - 'https://opensource-demo.orangehrmlive.com/*'    # HR portal demo (auth + SPA)
  - 'https://precio.mapfre.es/*'    # tarificador seguro hogar (prod real, autorizado QA; run único happy-path)
  - 'https://www.mapfre.es/ahorro-inversion/*'    # sección ahorro e inversión (prod real, autorizado QA 2026-06-18; happy-path)
  - 'https://www.santalucia.es/es/segurosmultirramo*'    # Santalucía seguros multirramo (prod real, autorizado QA 2026-06-18; happy-path home)
  - 'https://spv.pre.mapfre.net/*'    # onesait Prestaciones PRE (preproducción, no productivo; autorizado QA; CP001 rescate autolimpiante)
  - 'https://tufarmaciaelche.es/*'    # e-commerce farmacia (prod real, autorizado QA 2026-08-15; solo lectura + carrito de sesión, sin checkout ni formularios)
  - 'https://tienda.tufarmaciaelche.es/*'    # subdominio tienda (PrestaShop) del mismo dominio autorizado; mismas restricciones

  # Gira de stacks corporativos (kernel v2) — showcases públicos de las familias de
  # UI que dominan banca/seguros. Sitios de demostración, sin cuentas ni datos
  # personales: se interactúa con los widgets de ejemplo y nada más.
  # NO USABLE: showcase.primefaces.org sirve un muro de verificación anti-bot
  # (Cloudflare "Performing security verification") ante el navegador automatizado.
  # Saltárselo está prohibido y además invalidaría la medición. Comprobado 2026-08-15.
  # - 'https://primefaces.org/showcase*'
  - 'https://showcase.bootsfaces.net/*'    # sitio 1: JSF 2.x + Bootstrap (familia de onesait), autorizado QA 2026-08-15
  - 'https://sdk.openui5.org/*'    # sitio 2 previsto: SAP UI5 (back-office de seguros)
  - 'https://www.primefaces.org/showcase-v14*'    # reserva por si el mirror sin muro sigue en pie

  # Entornos no productivos (cualquier subdominio)
  - 'https://*.qa.*'
  - 'https://*.test.*'
  - 'https://*.int.*'
  - 'https://*.staging.*'
  - 'https://*.dev.*'
  - 'https://*.uat.*'

  # Local
  - 'http://localhost:*'
  - 'http://127.0.0.1:*'
  - 'http://0.0.0.0:*'

# Patrones explícitamente prohibidos (regla C2 — production-like)
forbidden_patterns:
  - 'https://www.*.com/login'      # heurística: prod
  - 'https://prod.*'
  - 'https://*.production.*'

# Credenciales declaradas como test (no PII real, ver synthetic_fixtures en style-contract)
allowed_test_credentials:
  - username: standard_user
    password: secret_sauce
    source: 'saucedemo.com - publicly documented'
  - username: locked_out_user
    password: secret_sauce
    source: 'saucedemo.com - publicly documented'
  - username: problem_user
    password: secret_sauce
    source: 'saucedemo.com - publicly documented'
  - username: performance_glitch_user
    password: secret_sauce
    source: 'saucedemo.com - publicly documented'
  - username: practice
    password: 'SuperSecretPassword!'
    source: 'practice.expandtesting.com - publicly documented on /login page'
  - username: john
    password: demo
    source: 'parabank.parasoft.com - Parasoft demo account, publicly documented'
  - username: Admin
    password: admin123
