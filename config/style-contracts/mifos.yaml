# Style Contract — demo.mifos.io — Mifos X web-app (core banking sobre Apache Fineract)
# Schema docs: docs/references/style-contract-schema.md
#
# Por qué este sitio: es banca core de VERDAD (clientes, préstamos, cuentas de ahorro,
# asientos contables), no un showcase de widgets. El vocabulario de dominio y la forma
# de los flujos son los de un cliente de banca, que es contra lo que este producto
# tiene que funcionar.
#
# Stack medido el 2026-08-23 contra la pantalla de acceso real: Angular + Angular
# Material. Los campos exponen `label` accesible ("Username", "Password") y el botón
# expone rol y nombre ("Login"), así que los locators semánticos deberían resolver sin
# excepciones. De ahí que `css_fallback_attributes` vaya VACÍO a propósito: Angular
# Material genera ids del tipo `mat-input-0`, únicos pero inestables entre renders, y
# declarar la whitelist invitaría a emitirlos. Si el walker se queda sin poder emitir
# algún paso, se verá en el run y se decide con el dato delante — no antes.
#
# La pantalla de acceso trae además dos selectores propios del producto, `Tenant`
# (default) y `Server`, que no hay que tocar.

version: 1
project: mifos

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole
    - getByLabel
    - getByPlaceholder
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true
  css_fallback_attributes: []

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/mifos.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false        # WARNING auditable, no bloqueante en esta fase

auth:
  enabled: true
  login_path: /
  storage_state: playwright/.auth/mifos.json
  credentials_ref: 0
  # D39 — la señal de éxito tiene que existir SOLO en la pantalla de destino, nunca en
  # una barra de navegación que la app pinte también en su página de error. Se deja sin
  # fijar hasta medir el destino real del login: inventarla aquí es justo el defecto que
  # dejó pasar un HTTP 500 en verde en ParaBank.
  # success_signal: (pendiente de medición)
  #
  # No declarado a propósito: `concurrent_sessions`. Es un core banking sobre Fineract
  # con sesión de servidor y es candidato serio a sesión única — pero eso es hipótesis,
  # no medición, y la sonda es intrusiva. Sin declarar, el default es serializar.

evidence:
  screenshots: on

# Estado COMPARTIDO y mutable: el demo lo usa todo el mundo y los datos cambian. Igual
# que en ParaBank, un test no puede assertar un saldo, un contador ni un identificador
# concreto — solo señales de UI y postcondiciones de negocio.
synthetic_fixtures:
  credentials:
    - username: mifos
      password: password
  test_cards: []
  test_iban: []

test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  coverage:
    negatives_by_flow: {}
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
