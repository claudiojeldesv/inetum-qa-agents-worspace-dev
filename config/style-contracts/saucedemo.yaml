# Style Contract — SauceDemo MVP demo
# Schema docs: docs/references/style-contract-schema.md

version: 1
project: saucedemo

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByTestId      # SauceDemo expone data-test en todo elemento interactivo
    - getByRole
    - getByLabel
    - getByText
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  spec_pattern: '{feature}.{scenario}.spec.ts'
  test_title_pattern: '{scenario_human_name}'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false   # gate off por defecto (v0.2 design/gates-off-by-default); warning, no aborta
  severity_threshold:
    - serious
    - critical

# Evidencia visual para el reporte Allure: captura el estado final de cada test
# (pase o falle). El command lo mapea a QA_SCREENSHOT en el Verification step.
evidence:
  screenshots: on

# Credenciales publicadas por Sauce Labs — no son PII real
synthetic_fixtures:
  credentials:
    - username: standard_user
      password: secret_sauce
    - username: locked_out_user
      password: secret_sauce
    - username: problem_user
      password: secret_sauce
    - username: performance_glitch_user
      password: secret_sauce
  test_cards: []
  test_iban: []

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
