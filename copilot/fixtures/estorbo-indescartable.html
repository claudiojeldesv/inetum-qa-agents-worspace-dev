<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Estorbo que no se deja descartar</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .contenido { padding: 20px; }
    /* El overlay ocupa la franja inferior y TAPA lo que haya debajo (z-index
       alto). Su boton va al EXTREMO derecho a proposito: asi el ultimo recurso
       del descarte generico (clicar el propio estorbo, que apunta a su centro)
       no puede pulsarlo por accidente. */
    .promo-overlay {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
      background: #148f77; color: white; padding: 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tapado { position: fixed; left: 20px; bottom: 30px; z-index: 1; }
  </style>
</head>
<!--
  La CLASE medida en la gira (sitio 1): un estorbo DECLARADO en el contract que
  la estrategia genérica NO puede descartar. Aquí es un modal de captación
  (boletín), NO un banner de cookies: el consentimiento tiene su propio camino
  por diseño desde K0.30 (ver consent.test.ts), y este fixture cubre el resto de
  overlays — promociones, encuestas, avisos de sesión.
  - Escape no hace nada (sin listener de teclado).
  - No hay botón de cierre: el único botón es la propia acción del modal.
  - Clicar el propio overlay tampoco lo cierra.
  Sin el arreglo K0.29, declararlo era PEOR que no declararlo: Playwright espera
  tras el manejador a que el estorbo se oculte, no se oculta nunca, y toda accion
  y toda espera de accionabilidad del run agotan su tope.
-->
<body>
  <div class="contenido">
    <h1>Panel</h1>
    <button id="libre" onclick="document.getElementById('salida').innerHTML='<div role=&quot;status&quot;>Accion libre hecha</div>'">Continuar</button>
    <div id="salida"></div>
  </div>

  <button class="tapado" id="debajo" onclick="document.getElementById('salida').textContent='NO deberia poder pulsarse'">Enviar formulario</button>

  <div class="promo-overlay" role="dialog" aria-label="Boletin">
    Suscribete a nuestro boletin. <button id="aceptar">Suscribirme</button>
  </div>

  <script>
    // el overlay solo desaparece completando su accion: nada que el walker deba pulsar
    document.getElementById('aceptar').addEventListener('click', () => {
      document.querySelector('.promo-overlay').remove();
    });
  </script>
</body>
</html>
