# Style Contract — automationintesting.online — Restful Booker Platform (hotel B&B)
# Schema docs: docs/references/style-contract-schema.md
# RBP v2.2 (2026-08-30): SPA React con DOS caras — publica (reserva + contacto,
# sin login) y admin (/admin, login-gated). Los formularios publicos usan
# PLACEHOLDER, no label (Firstname/Lastname/Email/Phone en reserva; el contacto
# usa ids #name/#email/#phone/#subject/#description): getByPlaceholder va alto
# en la prioridad a proposito.
#
# Rasgos medidos en el reconocimiento (.work/e2e-rbp/literales.json):
# - La demo se REINICIA por ventanas (la app entera, con breves caidas de frontend
#   y backend). Los datos persisten entre reinicios mas de lo esperado: las fechas
#   de reserva deben ser UNICAS por caso o el POST /api/booking devuelve 409.
# - DEFECTO CONOCIDO del sitio: ante 409 (doble-booking) el frontend revienta
#   (TypeError ... reading 'length') y queda pagina en blanco sin mensaje. Es un
#   caso negativo LEGITIMO: la postcondicion del FD no se cumple y el veredicto
#   es "el FD tiene razon" (defecto de producto). NO parchear el test para
#   esquivarlo.
# - El badge "Messages N" del admin decrementa al leer un mensaje: oraculo de
#   contador → assertar señal, no numero absoluto (la bandeja es compartida).
#
# A11y: inject siempre (hard rule SPEC); fail_on_violations=false (demo publico).

version: 1
project: restful-booker

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole
    - getByPlaceholder
    - getByLabel
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/restful-booker.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false
  severity_threshold:
    - serious
    - critical

# Solo la cara ADMIN va tras login; la publica no. El auth-handler se usa
# unicamente en los flujos admin-*. success_signal verificado en vivo: tras
# login aparece el enlace "Rooms" del nav admin y la tabla Room #/Type/....
auth:
  enabled: true
  login_path: /admin
  storage_state: playwright/.auth/rbp-admin.json
  credentials_ref: 0
  success_signal:
    type: locator
    value: "getByRole('link', { name: 'Report' })"

evidence:
  screenshots: on

# Credenciales demo del README oficial de mwinteringham/restful-booker-platform.
# OJO: la pantalla de login NO las imprime (verificado en el reconocimiento
# 2026-08-30, captura 08-admin-login.png) — la fuente es el README del proyecto.
synthetic_fixtures:
  credentials:
    - username: admin
      password: password
  test_cards: []
  test_iban: []

test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  coverage:
    negatives_by_flow: {}
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
