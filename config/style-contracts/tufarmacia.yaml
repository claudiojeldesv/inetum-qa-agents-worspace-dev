# Style Contract — tufarmaciaelche (tienda PrestaShop)
# Schema docs: docs/references/style-contract-schema.md
# Restricción del target (prod real, autorizado QA 2026-08-15): solo lectura +
# carrito de sesión. Sin checkout (/pedido), sin formularios con datos, sin cuentas.

version: 1
project: tufarmacia

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole        # PrestaShop clásico: sin data-testid; roles y textos visibles
    - getByLabel
    - getByText
  forbid_css_selectors: true
  forbid_xpath: true

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/tufarmacia.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false
  severity_threshold:
    - serious
    - critical

evidence:
  level: full
  screenshots: on

# Sin `obstructions`: el banner CookieYes de este dominio lo cubre el
# consentimiento POR DISEÑO del walker (K0.30) — la familia CookieYes está en el
# catálogo del kernel. Declararlo aquí era redescubrir en cada cliente algo que
# pasa en la mayoría de los portales. `obstructions` queda para estorbos que NO
# son de consentimiento (backdrops fantasma, snackbars).

# Sin credenciales: los dos flujos del guion operan como invitado, cero secretos.
synthetic_fixtures:
  credentials: []
  buyer_info: []
  test_cards: []
  test_iban: []

test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
