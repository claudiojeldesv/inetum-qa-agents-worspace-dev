# Style Contract — the-internet.herokuapp.com — Sinatra, páginas de práctica QA
#
# Por qué este sitio: es I6 del plan gate-locators-medidos (medir G1+G3 extremo a
# extremo en un sitio nuevo) Y el tercer sitio de la gira de dominio. Además es el
# experimento de la predicción de genericidad (docs/findings/genericidad-del-motor.md §7):
# clase de aplicación SIMPLE ya cubierta de sobra → este contract debería ser puro
# boilerplate, cero mecanismos nuevos.
#
# MEDICIÓN DE LA PREDICCIÓN (2026-08-24): declaraciones que este sitio necesitó que
# Dolibarr no hubiera necesitado ya: UNA — css_fallback_attributes: [id], porque el
# combobox de /dropdown no tiene nombre accesible y solo es identificable por
# id="dropdown" (medido por el planner y confirmado por verify-locators). Sin locale
# (un solo idioma), sin entry_steps (el login vive en /login), sin política de sesión.
# La predicción era "cero o una": cumplida en el borde.

version: 1
project: the-internet

pom:
  enabled: true
  location: tests/pages
  class_suffix: Page

locators:
  priority:
    - getByRole
    - getByLabel
    - getByPlaceholder
    - getByText
    - getByTestId
  forbid_css_selectors: true
  forbid_xpath: true
  # UNA excepción medida: el combobox de /dropdown no tiene nombre accesible; el
  # discovery lo identifica por id="dropdown" (D34: el scaffolder emite el fallback
  # comentado y MF-1 exige que el atributo esté en esta whitelist).
  css_fallback_attributes:
    - id

naming:
  language: es
  spec_pattern: '{id}_{feature}.{condicion}.spec.ts'
  test_title_pattern: '{condicion} → {resultado}'

tc_registry:
  enabled: true
  path: 'config/tc-registry/the-internet.json'
  id_prefix: 'TC'

asserts:
  semantic_only: true
  forbid_text_equality: true

waits:
  forbid_wait_for_timeout: true
  prefer_locators_assert: true

fixtures:
  location: tests/fixtures
  synthetic_data_only: true

a11y:
  inject_axe_check: true
  fail_on_violations: false

# El login vive en /login y se alcanza por URL: el manejador estándar sirve tal cual.
# Se deja apagado porque la mayoría de las páginas del sitio no requieren sesión;
# el flujo de login se prueba como caso propio, no como precondición compartida.
auth:
  enabled: false
  # login_path: /login
  # credentials_ref: 0

evidence:
  screenshots: on

# Credenciales IMPRESAS EN LA PROPIA PÁGINA /login del sitio (verificado en el
# HTML el 2026-08-24). Sitio de práctica público, sin datos reales.
synthetic_fixtures:
  credentials:
    - username: tomsmith
      password: 'SuperSecretPassword!'
  test_cards: []
  test_iban: []

test_design:
  require_business_postcondition: true
  min_functional_asserts: 1
  forbid_navigation_only_test: true
  coverage:
    negatives_by_flow:
      login: 1
  no_assume_undiscovered_flows: true

banned_apis:
  - page.waitForTimeout
  - assert.equal
  - xpath
